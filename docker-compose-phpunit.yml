---
services:
    wordpress:
        environment:
          COMPOSER_AUTH: ${COMPOSER_AUTH}
        image: ghcr.io/awesomemotive/edd-unit-test-images/php:${TEST_PHP_VERSION}
        depends_on:
            db:
              condition: service_healthy
        links:
            - db:mysql
        volumes:
            - .:/app
        working_dir: /app
        command: [ "bin/run-tests-internal-only.sh", "wordpress_test", "root", "", "mysql", "${TEST_WP_VERSION}", "${FILTER}", 'true', "${TEST_EXTRA_PLUGINS}" ]
    db:
        image: mariadb:10.4
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: "wordpress_test"
            MYSQL_ROOT_PASSWORD: ""
        # The database is rebuilt every run, so durability only costs disk syncs.
        tmpfs:
            - /var/lib/mysql
        command: [ "--innodb-flush-log-at-trx-commit=0", "--sync-binlog=0", "--innodb-doublewrite=0" ]
        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck.sh", "--su-mysql", "--connect" ]
            # Without these, the first check waits out Docker's default 30s interval.
            start_period: 60s
            start_interval: 1s
